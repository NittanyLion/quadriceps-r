name: R-CMD-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: R ${{ matrix.r }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        r: ['release', 'oldrel-1']
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      # base R only, so there are no dependencies to install
      - run: R CMD build .
      - run: R CMD check --no-manual --as-cran quadriceps_*.tar.gz
      - name: Fail on warnings (the quality gate)
        run: |
          if grep -q 'WARNING' quadriceps.Rcheck/00check.log; then cat quadriceps.Rcheck/00check.log; exit 1; fi
      - name: Show the check log on failure
        if: failure()
        run: cat quadriceps.Rcheck/00check.log quadriceps.Rcheck/tests/*.Rout* || true
